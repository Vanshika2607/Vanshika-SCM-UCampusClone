<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="icon" href="ucampus2.jpg">
    <title>Welcome to UCampus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url(12.webp); /* You can replace this with the actual background image pattern */
            background-repeat: no-repeat;
            background-size: cover;
        }
        .container {
            width: 350px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .logo {
            margin-bottom: 20px;
            
        }
        .logo img {
            width: 200px;
            height: 200px;
        }
        .input-box {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .input-box img {
            width: 30px;
            margin-right: 10px;
        }
        .input-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            padding: 5px;
        }
        .btn-send {
            background-color: #e53935;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-send:hover {
            background-color: #d32f2f;
        }
        a:visited{
            color: white;
        }
        a:hover{
            color: rgb(128, 15, 0);
         }
         a:active{
            color: pink;
         }
        .separator {
            margin: 20px 0;
            position: relative;
            text-align: center;
        }
        .separator::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-top: 1px solid #ddd;
        }
        .separator span {
            background-color: #fff;
            padding: 0 10px;
            position: relative;
            font-size: 14px;
        }
        .btn-truecaller {
            background-color: #0b90c8;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-truecaller:hover {
            background-color: #0a7cb1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Section -->
        <div class="logo">
            <img src="ucampus2.jpg" alt="Campus Logo">
        </div>

        <!-- Phone Number Input -->
        <div class="input-box">
            <img src="india flag.jpg" alt="India Flag">
            <input type="tel" id="phoneNumber" placeholder="+91 Mobile Number">
        </div>

        <!-- Send OTP Button -->
        <button class="btn-send" id="sendOtp">Send OTP</button>

        <!-- OR Separator -->
        <div class="separator">
            <!-- <span>OR</span> -->
        </div>

        <!-- Continue with Truecaller -->
        <!-- <button class="btn-truecaller"><a href="2.html">Continue with Truecaller</a></button> -->
    </div>


    <script>
        document.getElementById('sendOtp').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value;

            // Simulate OTP sending
            if (phoneNumber) {
                alert(`OTP has been sent to ${phoneNumber}`);
                // Redirect to OTP verification page
                window.location.href = '2.html?phone=' + encodeURIComponent(phoneNumber);
            } else {
                alert('Please enter a valid phone number.');
            }
        });
    </script>
</body>
</html>
