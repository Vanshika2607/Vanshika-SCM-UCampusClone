<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Animate.css for animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="icon" href="ucampus2.jpg">
    <title>Welcome to UCampus</title>
    <style>
        :root {
            --primary-color: #e53935;
            --primary-hover: #d32f2f;
            --secondary-color: #0b90c8;
            --secondary-hover: #0a7cb1;
            --text-color: #333;
            --light-gray: #f8f9fa;
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(135deg, rgba(229, 57, 53, 0.1) 0%, rgba(11, 144, 200, 0.1) 100%), url(12.webp);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
            color: var(--text-color);
        }
        
        .container {
            width: 100%;
            max-width: 380px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            text-align: center;
            transform: translateY(0);
            transition: var(--transition);
            animation: fadeInUp 0.6s ease-out;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        .logo {
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }
        
        .logo img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            transition: var(--transition);
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.1));
        }
        
        .logo img:hover {
            transform: scale(1.05);
        }
        
        .input-box {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: var(--border-radius);
            padding: 12px 15px;
            background-color: var(--light-gray);
            transition: var(--transition);
        }
        
        .input-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.2);
        }
        
        .input-box img {
            width: 28px;
            margin-right: 12px;
            transition: var(--transition);
        }
        
        .input-box:hover img {
            transform: rotate(5deg);
        }
        
        .input-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            padding: 5px;
            background-color: transparent;
            color: var(--text-color);
        }
        
        .input-box input::placeholder {
            color: #999;
        }
        
        .btn {
            border: none;
            border-radius: var(--border-radius);
            padding: 14px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-send {
            background-color: var(--primary-color);
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(229, 57, 53, 0.3);
        }
        
        .btn-send:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(229, 57, 53, 0.4);
        }
        
        .btn-send:active {
            transform: translateY(0);
        }
        
        a:visited {
            color: white;
        }
        
        a:hover {
            color: rgb(255, 235, 235);
        }
        
        a:active {
            color: pink;
        }
        
        .separator {
            margin: 25px 0;
            position: relative;
            text-align: center;
            color: #999;
        }
        
        .separator::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-top: 1px solid #e0e0e0;
        }
        
        .separator span {
            background-color: #fff;
            padding: 0 15px;
            position: relative;
            font-size: 14px;
        }
        
        .btn-truecaller {
            background-color: var(--secondary-color);
            color: white;
            box-shadow: 0 4px 6px rgba(11, 144, 200, 0.3);
        }
        
        .btn-truecaller:hover {
            background-color: var(--secondary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(11, 144, 200, 0.4);
        }
        
        .btn-truecaller:active {
            transform: translateY(0);
        }
        
        .btn-icon {
            margin-right: 10px;
            width: 20px;
            height: 20px;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            
            .logo img {
                width: 150px;
                height: 150px;
            }
        }
        
        /* Loading animation */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container animate__animated animate__fadeIn">
        <!-- Logo Section -->
        <div class="logo animate__animated animate__bounceIn">
            <img src="ucampus2.jpg" alt="Campus Logo" class="animate__animated animate__pulse animate__infinite">
        </div>

        <!-- Phone Number Input -->
        <div class="input-box animate__animated animate__fadeIn animate__delay-1s">
            <img src="india flag.jpg" alt="India Flag">
            <input type="tel" id="phoneNumber" placeholder="+91 Mobile Number" required>
        </div>

        <!-- Send OTP Button -->
        <button class="btn btn-send animate__animated animate__fadeIn animate__delay-1s" id="sendOtp">
            Send OTP
            <div class="loader" id="loader"></div>
        </button>

        <!-- OR Separator -->
        <div class="separator animate__animated animate__fadeIn animate__delay-1s">
            <span>OR</span>
        </div>

        <!-- Continue with Truecaller -->
        <button class="btn btn-truecaller animate__animated animate__fadeIn animate__delay-2s">
            <img src="https://truecaller.blog/wp-content/uploads/2018/07/TC-Icon-Circle-White.png" alt="Truecaller" class="btn-icon">
            Continue with Truecaller
        </button>
    </div>

    <script>
        document.getElementById('sendOtp').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const loader = document.getElementById('loader');
            const button = this;
            
            // Show loading animation
            button.disabled = true;
            loader.style.display = 'inline-block';
            button.style.opacity = '0.8';
            
            // Simulate API call with delay
            setTimeout(function() {
                // Hide loading animation
                loader.style.display = 'none';
                button.disabled = false;
                button.style.opacity = '1';
                
                // Simulate OTP sending
                if (phoneNumber && phoneNumber.length >= 10) {
                    // Add success animation
                    button.classList.add('animate__animated', 'animate__pulse');
                    setTimeout(() => {
                        button.classList.remove('animate__animated', 'animate__pulse');
                    }, 1000);
                    
                    // Redirect to OTP verification page
                    setTimeout(() => {
                        window.location.href = '2.html?phone=' + encodeURIComponent(phoneNumber);
                    }, 1500);
                } else {
                    // Add error shake animation
                    button.classList.add('animate__animated', 'animate__shakeX');
                    setTimeout(() => {
                        button.classList.remove('animate__animated', 'animate__shakeX');
                    }, 1000);
                    alert('Please enter a valid 10-digit phone number.');
                }
            }, 1500);
        });
        
        // Add animation when input is focused
        document.getElementById('phoneNumber').addEventListener('focus', function() {
            this.parentElement.classList.add('animate__animated', 'animate__pulse');
            setTimeout(() => {
                this.parentElement.classList.remove('animate__animated', 'animate__pulse');
            }, 1000);
        });
    </script>
</body>
</html>
