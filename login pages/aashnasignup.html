<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="//cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>
    <title>WHIZLIST(Login Page)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #c9d6ff;
            background: linear-gradient(135deg, #e2e2e2, #c9d6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            animation: gradientBG 15s ease infinite;
            background-size: 400% 400%;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            background-color: #fff;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            width: 800px;
            max-width: 95%;
            min-height: 500px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0.95);
            opacity: 0;
            animation: fadeInUp 0.8s forwards 0.3s;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(20px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .container:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            transform: translateY(-5px);
        }

        .container p {
            font-size: 14px;
            line-height: 20px;
            letter-spacing: 0.3px;
            margin: 20px 0;
            color: #555;
        }

        .container span {
            font-size: 12px;
            color: #777;
        }

        .container a {
            color: #512da8;
            font-size: 13px;
            text-decoration: none;
            margin: 15px 0 10px;
            transition: color 0.3s;
            font-weight: 500;
        }

        .container a:hover {
            color: #311b92;
            text-decoration: underline;
        }

        .container button {
            background-color: #512da8;
            color: #fff;
            font-size: 13px;
            padding: 12px 50px;
            border: 1px solid transparent;
            border-radius: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(81, 45, 168, 0.3);
        }

        .container button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .container button:hover {
            background-color: #5c6bc0;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(81, 45, 168, 0.4);
        }

        .container button:hover::after {
            transform: translateX(100%);
        }

        .container button.hidden {
            background-color: transparent;
            border: 2px solid #fff;
            color: #fff;
            box-shadow: none;
        }

        .container button.hidden:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .container form {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .container input {
            background-color: #eee;
            border: none;
            margin: 10px 0;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 8px;
            width: 100%;
            outline: none;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .container input:focus {
            border-color: #512da8;
            box-shadow: 0 0 0 3px rgba(81, 45, 168, 0.2);
            background-color: #fff;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in {
            left: 0;
            width: 50%;
            z-index: 2;
            animation: slideInLeft 0.8s ease-out;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .container.active .sign-in {
            transform: translateX(100%);
        }

        .sign-up {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
            animation: fadeIn 0.5s ease-out 0.5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .container.active .sign-up {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: move 0.6s;
        }

        @keyframes move {
            0%, 49.99% {
                opacity: 0;
                z-index: 1;
            }
            50%, 100% {
                opacity: 1;
                z-index: 5;
            }
        }

        .social-icons {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        .social-icons a {
            border: 1px solid #ddd;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            width: 40px;
            height: 40px;
            color: #555;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .social-icons a:nth-child(1):hover {
            background: #DB4437;
            color: white;
            border-color: #DB4437;
        }

        .social-icons a:nth-child(2):hover {
            background: #4267B2;
            color: white;
            border-color: #4267B2;
        }

        .social-icons a:nth-child(3):hover {
            background: #333;
            color: white;
            border-color: #333;
        }

        .social-icons a:nth-child(4):hover {
            background: #0077B5;
            color: white;
            border-color: #0077B5;
        }

        .toggle-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: all 0.6s ease-in-out;
            border-radius: 150px 0 0 100px;
            z-index: 1000;
        }

        .container.active .toggle-container {
            transform: translateX(-100%);
            border-radius: 0 150px 100px 0;
        }

        .toggle {
            background-color: #512da8;
            height: 100%;
            background: linear-gradient(to right, #5c6bc0, #512da8);
            color: #fff;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: all 0.6s ease-in-out;
        }

        .container.active .toggle {
            transform: translateX(50%);
        }

        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            transform: translateX(0);
            transition: all 0.6s ease-in-out;
        }

        .toggle-left {
            transform: translateX(-200%);
        }

        .container.active .toggle-left {
            transform: translateX(0);
        }

        .toggle-right {
            right: 0;
            transform: translateX(0);
        }

        .container.active .toggle-right {
            transform: translateX(200%);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #333;
            font-weight: 700;
            background: linear-gradient(to right, #512da8, #5c6bc0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGradient 5s ease infinite;
            background-size: 200% 200%;
        }

        .toggle-panel h1 {
            color: #fff;
            background: none;
            -webkit-background-clip: initial;
            background-clip: initial;
        }

        @keyframes textGradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating animation for the container */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .container {
            animation: float 6s ease-in-out infinite;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                width: 90%;
                min-height: 400px;
            }
            
            .form-container {
                padding: 0 30px;
            }
            
            .toggle-container {
                display: none;
            }
            
            .sign-in,
            .sign-up {
                width: 100%;
            }
            
            .container.active .sign-in,
            .container.active .sign-up {
                transform: translateX(0);
            }
        }

        /* Particle animation background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(81, 45, 168, 0.2);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="particles" id="particles"></div>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="https://www.google.co.in/" class="icon" target="_blank"><i
                            class="fa-brands fa-google-plus-g"></i></a>
                    <a href="https://www.facebook.com/" class="icon" target="_blank"><i
                            class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://github.com/" class="icon" target="_blank"><i class="fa-brands fa-github"></i></a>
                    <a href="https://in.linkedin.com/" class="icon" target="_blank"><i
                            class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email for registeration</span>
                <input type="text" id="username" placeholder="Username">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <button><a href="5.html">Sign Up</a></button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form>
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="https://www.google.co.in/" class="icon" target="_blank"><i
                            class="fa-brands fa-google-plus-g"></i></a>
                    <a href="https://www.facebook.com/" class="icon" target="_blank"><i
                            class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://github.com/" class="icon" target="_blank"><i class="fa-brands fa-github"></i></a>
                    <a href="https://in.linkedin.com/" class="icon" target="_blank"><i
                            class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email password</span>
                <input type="email" id="email1" placeholder="Email">
                <input type="password" id="password1" placeholder="Password">
                <a href="#">Forget Your Password?</a>
                <button><a href="5.html">Sign In</a></button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Friend!</h1>
                    <p>Register with your personal details to use all of site features</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initial alert
        setTimeout(() => {
            alert("Welcome User! Please fill the details");
        }, 500);
        
        // Container animation
        const container = document.getElementById('container');
        const registerBtn = document.getElementById('register');
        const loginBtn = document.getElementById('login');

        registerBtn.addEventListener('click', () => {
            container.classList.add("active");
        });

        loginBtn.addEventListener('click', () => {
            container.classList.remove("active");
        });
        
        // Voice commands
        if (annyang) {
            var commands = {
                'hello': () => { 
                    const helloMsg = document.createElement('div');
                    helloMsg.textContent = 'Please Login to enjoy various features of Whizlist!';
                    helloMsg.style.position = 'fixed';
                    helloMsg.style.top = '20px';
                    helloMsg.style.left = '50%';
                    helloMsg.style.transform = 'translateX(-50%)';
                    helloMsg.style.backgroundColor = '#512da8';
                    helloMsg.style.color = 'white';
                    helloMsg.style.padding = '15px 25px';
                    helloMsg.style.borderRadius = '25px';
                    helloMsg.style.boxShadow = '0 5px 15px rgba(0,0,0,0.2)';
                    helloMsg.style.zIndex = '1000';
                    helloMsg.style.animation = 'fadeInUp 0.5s ease-out';
                    document.body.appendChild(helloMsg);
                    
                    setTimeout(() => {
                        helloMsg.style.animation = 'fadeOut 0.5s ease-out forwards';
                        setTimeout(() => {
                            document.body.removeChild(helloMsg);
                        }, 500);
                    }, 3000);
                },

                'write username *tag': function (variable) {
                    fillFieldWithAnimation('username', variable);
                },
                'write email *tag': function (variable) {
                    fillFieldWithAnimation('email', variable);
                },
                'write password *tag': function (variable) {
                    fillFieldWithAnimation('password', variable);
                },
                'write email *tag': function (variable) {
                    fillFieldWithAnimation('email1', variable);
                },
                'write password *tag': function (variable) {
                    fillFieldWithAnimation('password1', variable);
                },
            };

            function fillFieldWithAnimation(id, value) {
                const field = document.getElementById(id);
                if (field) {
                    field.style.transform = 'scale(1.05)';
                    field.style.boxShadow = '0 0 0 3px rgba(81, 45, 168, 0.3)';
                    field.value = value;
                    
                    setTimeout(() => {
                        field.style.transform = 'scale(1)';
                        field.style.boxShadow = 'none';
                    }, 500);
                }
            }

            annyang.addCommands(commands);
            annyang.start();
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size between 5px and 15px
                const size = Math.random() * 10 + 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // Random animation duration between 10s and 20s
                const duration = Math.random() * 10 + 10;
                particle.style.animationDuration = `${duration}s`;
                
                // Random delay
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                // Random opacity
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Initialize particles and animations
        window.addEventListener('load', () => {
            createParticles();
            
            // Add hover effect to buttons with links
            const buttons = document.querySelectorAll('button a');
            buttons.forEach(button => {
                button.addEventListener('mouseenter', () => {
                    button.parentElement.style.transform = 'translateY(-2px)';
                });
                button.addEventListener('mouseleave', () => {
                    button.parentElement.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
</body>

</html>
