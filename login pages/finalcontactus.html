<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Document</title>
    <style>
        /* Global Styles */
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          margin: 0;
          padding: 0;
          background-image: url("contact\ us\ pic.jpg"); /* Replace with your image URL */
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
          color: #333;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
        }
    
        .container {
          max-width: 500px;
          margin: 50px auto;
          padding: 30px;
          background: rgba(255, 255, 255, 0.9); /* Slight opacity to blend with the background */
          box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
          border-radius: 12px;
          overflow: hidden;
          width: 100%;
          height: 800px;
        }
    
        /* Header Styling */
        h1 {
          text-align: center;
          font-size: 2.5rem;
          color: #333;
          margin-bottom: 30px;
          text-transform: uppercase;
          letter-spacing: 1px;
        }
    
        /* Contact Info Section */
        .contact-info {
          margin-bottom: 40px;
          padding: 20px;
          background-color: #f1f1f1;
          border-radius: 8px;
          box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.05);
        }
    
        .contact-info p {
          margin: 10px 0;
          font-size: 1.1rem;
          color: #555;
        }
    
        .contact-info strong {
          color: #007BFF;
        }
    
        /* Form Section */
        form {
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
    
        .form-group {
          display: flex;
          flex-direction: column;
          gap: 5px;
        }
    
        .form-group label {
          font-size: 1rem;
          color: #444;
          font-weight: 600;
        }
    
        .form-group input,
        .form-group textarea {
          padding: 12px;
          font-size: 1rem;
          border: 1px solid #ccc;
          border-radius: 8px;
          transition: all 0.3s ease;
        }
    
        .form-group input:focus,
        .form-group textarea:focus {
          border-color: #007BFF;
          outline: none;
        }
    
        .form-group textarea {
          resize: vertical;
          min-height: 150px;
        }
    
        /* Submit Button */
        button {
          padding: 15px;
          font-size: 1.1rem;
          color: #fff;
          background-color: #007BFF;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          transition: background-color 0.3s ease;
        }
    
        button:hover {
          background-color: #0056b3;
        }
    
        /* Footer Section */
        footer {
          text-align: center;
          margin-top: 40px;
          color: #777;
          font-size: 0.9rem;
        }
    
        footer p {
          margin: 10px 0;
        }
    
        /* Responsive Design */
        @media (max-width: 768px) {
          .container {
            padding: 20px;
            margin: 30px 15px;
          }
    
          h1 {
            font-size: 2rem;
          }
    
          .contact-info {
            padding: 15px;
          }
    
          .form-group input, .form-group textarea {
            font-size: 0.9rem;
          }
    
          button {
            font-size: 1rem;
          }
        }
      </style>
</head>

<body>
    <button type="button" class="btn btn-primary" data-bs-target="#demo" data-bs-toggle="modal">
        open
    </button>
    <div class="modal fade" id="demo">

        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">   <!--modal-sm , modal-md , modal-lg-->

            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title">Welcome</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">
                    <body>
                        <div class="container">
                          <h1>Contact Us</h1>
                          
                          <!-- Contact Info Section -->
                          <div class="contact-info">
                            <p><strong>Address:</strong> 123 Main Street, Your City, Your Country</p>
                            <p><strong>Phone:</strong> +123 456 7890</p>
                            <p><strong>Email:</strong> contact@yourdomain.com</p>
                            <p><strong>Business Hours:</strong> Monday - Friday, 9 AM - 6 PM</p>
                          </div>
                      
                          <!-- Contact Form Section -->
                          <form action="your-server-endpoint" method="POST">
                            <div class="form-group">
                              <label for="name">Full Name</label>
                              <input type="text" id="name" name="name" placeholder="Your Name" required>
                            </div>
                            <div class="form-group">
                              <label for="email">Email Address</label>
                              <input type="email" id="email" name="email" placeholder="Your Email" required>
                            </div>
                            <div class="form-group">
                              <label for="message">Message</label>
                              <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                            </div>
                            <button type="submit">Submit</button>
                          </form>
                        </div>
                      
                        <!-- Footer Section -->
                        <footer>
                          <p>&copy; 2024 Your Company Name. All Rights Reserved.</p>
                        </footer>
                      </body>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                        close
                    </button>
                </div>

            </div>
        </div>

    </div>
</body>

</html>
