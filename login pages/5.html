<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Campus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .header {
            background-color: #d50000;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 1.5em;
        }

        .location-icon {
            width: 100px;
            margin: 20px auto;
            display: block;
        }

        .location-btn {
            background-color: #d50000;
            color: white;
            border: none;
            padding: 15px;
            width: 80%;
            margin: 20px auto;
            border-radius: 10px;
            font-size: 1.1em;
            display: block;
            cursor: pointer;
        }

        .campus-list {
            background-color: white;
            width: 90%;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
        }

        .campus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .campus-item:last-child {
            border-bottom: none;
        }

        .campus-item:hover {
            background-color: #f8f8f8;
        }

        .campus-item .info {
            display: flex;
            align-items: center;
        }

        .campus-item .info img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }

        .campus-item .info span {
            font-size: 1.1em;
        }

        .campus-item .arrow {
            font-size: 1.5em;
            color: #d50000;
        }
    </style>
</head>
<body>

    <div class="header">
        Choose Your Campus
    </div>

    <img class="location-icon" src="Screenshot 2024-10-01 114821.png" alt="Location Icon">

    <button class="location-btn">Use Current Location</button>

    <div class="campus-list">
        <div class="campus-item" onclick="chooseCampus('Chitkara University, Punjab')">
            <div class="info">
                <img src="Screenshot 2024-10-01 113541.png" alt="Location Pin">
                <span>Chitkara University</span>
                <span style="color: #d50000; margin-left: 10px;">Punjab</span>
            </div>
            <div class="arrow">&gt;</div>
        </div>

        <div class="campus-item" onclick="chooseCampus('Chitkara University, Himachal')">
            <div class="info">
                <img src="Screenshot 2024-10-01 113541.png" alt="Location Pin">
                <span>Chitkara University</span>
                <span style="color: #d50000; margin-left: 10px;">Himachal</span>
            </div>
            <div class="arrow">&gt;</div>
        </div>
    </div>

    <script>
        function chooseCampus(campusName) {
            // Redirect to food ordering page with the selected campus as a query parameter
            window.location.href = 'HOME.HTML?campus=' + encodeURIComponent(campusName);
        }
    </script>

</body>
</html>
